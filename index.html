<title>Yooper Meals — what's for dinner?</title>

<script>
/* ══════════════════════════════════════════════════════════════════
   EDIT HERE.  This is the only part of the file you need to touch.
   ══════════════════════════════════════════════════════════════════ */

/* The Sunday the trip starts.  [ year, month, day ] — month is 1–12,
   so August is 8.  Everything else on the page counts from this date. */
const START = [2026, 8, 2];

/* Six dinners, Sunday through Friday, in order.  Keep it at six.
   Leave who as "" and the night shows as "Up for grabs".
   side1, side2, side3 and note can each be left as "" or left off entirely
   and they just won't show up.
   cook is an optional list of RECIPES keys — the night shows those recipes
   and the shopping list adds up what they call for.

   adults and kids are who is actually at the table that night.  They print
   on the night and they set how far the recipes are scaled, so keep them
   honest — people come and go through the week.
     adults  a number
     kids    a number if you only know the count, or a list of ages
             ([13, 11, 7, 3.5]) if you know them.  Ages are better: a
             thirteen-year-old eats an adult dinner and a three-year-old
             does not, and the recipe scaling knows the difference. */
const NIGHTS = [
  { meal: "Ribs",               who: "Mom",
    adults: 7,                  kids: 7,
    side1: "Coleslaw",          side2: "Green beans w/ bacon",
    side3: "Tater tots",
    note: "" },

  { meal: "Meatballs & Pasta",  who: "Jeff & Shanna",
    adults: 9,                  kids: 7,
    side1: "Garlic bread",      side2: "Italian salad",
    note: "",
    cook: ["meatballs", "marinara"] },

  { meal: "Free-for-All",       who: "Every person for themselves",
    adults: 9,                  kids: 7,
    side1: "Pasta salad",       side2: "Veggie tray & dip",
    note: "" },

  { meal: "Tacos",              who: "Joe & Ann",
    adults: 7,                  kids: [13, 11, 7, 3.5],
    side1: "Spanish rice",      side2: "Chips & guacamole",
    note: "" },

  { meal: "Grill Night",        who: "Elaine & Andrew",
    adults: 7,                  kids: [13, 11, 7, 3.5],
    side1: "Corn on the cob",   side2: "Potato salad",
    note: "" },

  { meal: "Pizza",              who: "Order out",
    adults: 7,                  kids: [13, 11, 7, 3.5],
    side1: "Garden salad",      side2: "Garlic knots",
    note: "" }
];

/* How much of a grown-up's dinner a kid of a given age actually eats.
   Used to turn a night's heads into portions, which is what the recipes
   are scaled against.  Edit these if the appetites here are wrong —
   they're a judgement call, not a fact. */
const KID_APPETITE = [
  { under: 5,   eats: 0.35 },
  { under: 10,  eats: 0.55 },
  { under: 13,  eats: 0.75 },
  { under: 999, eats: 1    }
];

/* What a kid counts for when the night gives a count and no ages. */
const KID_EATS = 0.5;

/* Some cook lines are statements about the night rather than a person.
   These print exactly as written, with no "Cooked by" in front. */
const AS_IS_COOKS = [
  "Up for grabs",
  "Every person for themselves",
  "Order out"
];

/* The kids' standbys — no schedule, they're around every night.
   Add or remove lines freely; there's no fixed count here. */
const KIDS = [
  "Chicken Nuggets",
  "Mac and Cheese",
  "PB&J",
  "Salami",
  "Yogurt",
  "Cheese Sticks",
  "Fruit",
  "Chips"
];

/* ── Recipes ────────────────────────────────────────────────────────
   A night points at these by key, through its cook list.

   Quantities are the recipe exactly as it was published — leave them
   alone.  Instead say how many grown-up portions the published recipe
   feeds, in serves, and the page works out the batch size from the heads
   on the night that's cooking it: every quantity and the yield are
   multiplied, on the page and in the shopping list.  Batches round to the
   nearest half, because half a recipe is a thing you can cook and 1.79 of
   one is not.  Monday is 9 adults and 7 kids — 12½ portions — so the
   meatballs come out double and the sauce triple.

   scale, if you set it, pins the batch size and ignores the heads
   entirely.  Reach for it only when a recipe genuinely isn't about how
   many people are eating.

   Each ingredient is { qty, unit, item, prep, group }.
     qty   a number, or null for "to taste" things with no amount
     unit  "lb", "cup", "clove"…  or "" when the item carries its own
     prep  "minced", "chopped" — shown in the recipe, not on the list
     group the aisle it lands in on the shopping list

   shop overrides what the shopping list says for that ingredient:
     shop: false        keep it out of the list entirely (tap water)
     shop: { … }        buy this instead — "9 tbsp onion" is useless in
                        a store, "1 large yellow onion" is not.  What
                        you write here is taken as-is and is NEVER
                        multiplied, so it's the real amount to put in
                        the cart.  The batch size moves on its own when
                        a night's heads change, so these are the lines
                        to look over by hand afterwards. */
const RECIPES = {

  meatballs: {
    title:  "Rao's Meatballs",
    source: "Rao's Cookbook — Frank Pellegrino",
    url:    "https://www.foodnetwork.com/recipes/raos-meatballs-5287055",
    time:   "About 1 hour",
    serves: 7,                                /* 14 meatballs, two apiece */
    makes:  { qty: 14, unit: "meatball" },
    ingredients: [
      { qty: 1,    unit: "lb",    item: "lean ground beef",                          group: "Meat" },
      { qty: 0.5,  unit: "lb",    item: "ground veal",                               group: "Meat" },
      { qty: 0.5,  unit: "lb",    item: "ground pork",                               group: "Meat" },
      { qty: 2,    unit: "",      item: "large eggs",                                group: "Dairy" },
      { qty: 1,    unit: "cup",   item: "Pecorino Romano", prep: "freshly grated",   group: "Dairy" },
      { qty: 1.5,  unit: "tbsp",  item: "flat-leaf parsley", prep: "chopped",        group: "Produce",
        shop: { qty: 1, unit: "bunch", item: "flat-leaf parsley" } },
      { qty: 1,    unit: "clove", item: "garlic", prep: "minced",                    group: "Produce" },
      { qty: 2,    unit: "cup",   item: "fine dry bread crumbs",                     group: "Pantry" },
      { qty: 1,    unit: "cup",   item: "olive oil", prep: "for frying",             group: "Pantry" },
      { qty: 2,    unit: "cup",   item: "lukewarm water",                            shop: false },
      { qty: null, unit: "",      item: "Salt and pepper", prep: "to taste",         group: "Pantry" }
    ],
    steps: [
      "Put the beef, veal and pork in a large bowl. Add the eggs, cheese, parsley, garlic, salt and pepper, and blend it together with your hands.",
      "Work in the bread crumbs.",
      "Add the water a cup at a time, until the mixture is quite moist.",
      "Shape into balls about two and a half inches across — roughly six ounces each. Wet hands help.",
      "Heat the oil in a large sauté pan over medium-high until hot but not smoking. Fry in batches: when the bottom is very brown and slightly crisp, turn and do the top.",
      "Drain on paper towels, then lower them into the marinara to finish."
    ]
  },

  marinara: {
    title:  "Rao's Marinara",
    source: "Rao's Cookbook — Frank Pellegrino",
    url:    "https://www.food.com/recipe/raos-marinara-sauce-393184",
    time:   "About 1½ hours, mostly unattended",
    serves: 4,                                /* a quart sauces four, pasta and all */
    makes:  { qty: 1, unit: "quart" },
    ingredients: [
      { qty: 2,    unit: "can",   item: "(28 oz) San Marzano tomatoes",              group: "Pantry" },
      { qty: 0.25, unit: "cup",   item: "olive oil",                                 group: "Pantry" },
      { qty: 2,    unit: "oz",    item: "salt pork or fatback",                      group: "Meat" },
      { qty: 3,    unit: "tbsp",  item: "onion", prep: "minced",                     group: "Produce",
        shop: { qty: 1, unit: "", item: "large yellow onion" } },
      { qty: 2,    unit: "clove", item: "garlic", prep: "minced",                    group: "Produce" },
      { qty: 6,    unit: "leaf",  item: "fresh basil", prep: "torn",                 group: "Produce",
        shop: { qty: 1, unit: "bunch", item: "fresh basil" } },
      { qty: null, unit: "",      item: "Dried oregano", prep: "a pinch",            group: "Pantry" },
      { qty: null, unit: "",      item: "Salt and pepper", prep: "to taste",         group: "Pantry" }
    ],
    steps: [
      "Tip the tomatoes out of the cans, keeping the juice. Crush them by hand, pulling out the hard core at the stem end and any tough skin or membrane.",
      "Heat the oil in a large nonreactive pot over medium-low. Add the salt pork and cook about 5 minutes, until the fat has rendered out, then lift out the pork and throw it away.",
      "Add the onion and cook about 3 minutes, until translucent and just starting to colour. Stir in the garlic and give it 30 seconds, just until it softens.",
      "Add the tomatoes with their juice and salt. Bring it up to a boil, then drop it straight down to a bare simmer and leave it about an hour, until it thickens slightly.",
      "Stir in the basil, oregano and pepper, and cook one more minute."
    ]
  }

};

/* On the shopping list but not part of any recipe — the pasta, the cheese
   for the table, anything else you already know you have to buy.
   Same shape as an ingredient, and these are never scaled. */
const EXTRAS = [
  { qty: 3, unit: "lb", item: "spaghetti",                    group: "Pantry" },
  { qty: 8, unit: "oz", item: "Pecorino Romano for the table", group: "Dairy" }
];

/* ══════════════════════════════════════════════════════════════════
   END OF THE EDITABLE PART.  Below here is layout and code.
   ══════════════════════════════════════════════════════════════════ */
</script>

<meta property="og:title" content="Yooper Meals">

<style>
/* ---- palette ------------------------------------------------------ */
:root {
  --pine:      #0F2E28;   /* page ground        */
  --pine-mid:  #123630;   /* far treeline       */
  --pine-lift: #16403A;   /* the week section   */
  --birch:     #EDE4D3;   /* primary text       */
  --lantern:   #F2A93B;   /* accent             */
  --lake:      #3C8079;   /* numbers, counter   */
  --ash:       #7E8F89;   /* secondary text     */

  --edge: clamp(1.25rem, 5vw, 2.5rem);
  --measure: 34rem;
}

/* ---- reset -------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body, h1, h2, p, ol, ul, li, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
[hidden] { display: none !important; }

body {
  background: var(--pine);
  color: var(--birch);
  font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

:focus-visible {
  outline: 2px solid var(--lantern);
  outline-offset: 3px;
  border-radius: 2px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* ---- masthead ----------------------------------------------------- */
.masthead {
  padding: 1.5rem var(--edge) 0;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
}
.wordmark {
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--lantern);
}
.masthead .stamp {
  font-size: .68rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ash);
}

/* ---- hero --------------------------------------------------------- */
.hero {
  position: relative;
  padding: clamp(2.5rem, 11vw, 4.5rem) 0 0;
  isolation: isolate;
  overflow: hidden;   /* keeps the glow from widening the page */
}

/* lantern glow */
.hero .glow {
  position: absolute;
  inset: -6% -20% 12%;
  z-index: -2;
  pointer-events: none;
  background: radial-gradient(58% 52% at 50% 40%,
              rgba(242,169,59,.24) 0%,
              rgba(242,169,59,.09) 42%,
              rgba(242,169,59,0) 72%);
  animation: breathe 9s ease-in-out infinite;
}

/* painted-plank seams, very faint */
.hero::before {
  content: "";
  position: absolute;
  inset: 0 0 20%;
  z-index: -1;
  pointer-events: none;
  background: repeating-linear-gradient(90deg,
              rgba(237,228,211,.03) 0 1px, transparent 1px 86px);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 28%, #000 72%, transparent);
  mask-image: linear-gradient(180deg, transparent, #000 28%, #000 72%, transparent);
}

.hero-inner {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 0 var(--edge) clamp(2rem, 7vw, 3rem);
  text-align: center;
  animation: rise .7s cubic-bezier(.2,.7,.3,1) both;
}

.eyebrow {
  font-size: .74rem;
  font-weight: 700;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--lantern);
  margin-bottom: clamp(.9rem, 3vw, 1.25rem);
}

.meal {
  font-family: Ultra, Georgia, "Times New Roman", serif;
  font-weight: 400;
  font-size: clamp(2.9rem, 13.5vw, 5.5rem);
  line-height: .95;
  letter-spacing: -.005em;
  text-wrap: balance;
  color: var(--birch);
  text-shadow: 0 2px 0 rgba(15,46,40,.55);
}

/* Sides sit directly under the meal name, quiet enough not to compete
   with it. The separator is --lake so --lantern stays reserved for
   tonight, the cook and the eyebrow. */
.sides {
  margin-top: clamp(.9rem, 3.5vw, 1.25rem);
  font-size: 1rem;
  color: rgba(237, 228, 211, .84);
}
.sides .sep,
.night-sides .sep,
.heads .sep,
.night-heads .sep {
  color: var(--lake);
  padding: 0 .2em;   /* the text itself already carries a space each side */
}

/* Who's actually at the table. A quiet stamp, not a headline — it's the
   answer to "how much do I make", which is the second question of the
   night, never the first. */
.heads {
  display: inline-block;
  margin-top: clamp(.9rem, 3.5vw, 1.25rem);
  padding: .32rem .8rem;
  border: 1px solid rgba(60,128,121,.5);
  border-radius: 999px;
  font-size: .78rem;
  line-height: 1.35;
  color: rgba(237, 228, 211, .8);
  text-wrap: balance;
}

.who {
  margin-top: clamp(.7rem, 2.5vw, 1rem);
  font-size: 1.05rem;
  font-weight: 500;
  color: var(--lantern);
}
/* A statement about the night, not a person — say it, but don't dress it
   up as a name. */
.who.is-phrase {
  color: var(--ash);
  font-weight: 400;
}

.note {
  margin: .7rem auto 0;
  max-width: 26rem;
  font-size: .95rem;
  color: var(--ash);
  text-wrap: pretty;
}

.counter {
  margin-top: clamp(1.5rem, 6vw, 2.25rem);
  font-size: .72rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--lake);
}

/* ---- treeline ----------------------------------------------------- */
/* Height is set rather than left to the aspect ratio so the trees stay a
   decent size on a phone; the slight horizontal give on wide screens is
   invisible on shapes this stylised. */
.treeline {
  display: block;
  width: 100%;
  height: clamp(84px, 13vw, 150px);
  margin-bottom: -1px;   /* no hairline between svg and section below */
}

/* ---- the week ----------------------------------------------------- */
.week {
  background: var(--pine-lift);
  padding: clamp(1.75rem, 7vw, 3rem) var(--edge) clamp(2.5rem, 9vw, 4rem);
}
.week-inner { max-width: var(--measure); margin: 0 auto; }

/* ---- tabs --------------------------------------------------------- */
.tabs {
  display: flex;
  gap: clamp(1.25rem, 6vw, 2rem);
  margin-bottom: 1.25rem;
  border-bottom: 1px solid rgba(237,228,211,.09);
}
.tab {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 0 0 .7rem;
  font: inherit;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ash);
  cursor: pointer;
}
.tab[aria-selected="true"] {
  color: var(--lantern);
  border-bottom-color: var(--lantern);
}

/* Both lists are the same row: a narrow marker column, then the meal. */
.night, .kid {
  display: grid;
  grid-template-columns: 2.35rem 1fr;
  gap: 0 .5rem;
  padding: 1.05rem 0;
  border-top: 1px solid rgba(237,228,211,.09);
}
.night:first-child, .kid:first-child { border-top: 0; padding-top: .25rem; }

.night .n {
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--lake);
  padding-top: .2rem;
  font-variant-numeric: tabular-nums;
}

.night .day {
  font-size: .68rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ash);
}
.night .night-meal {
  font-size: 1.22rem;
  font-weight: 500;
  line-height: 1.25;
  margin-top: .12rem;
  text-wrap: balance;
}
.night .night-sides {
  font-size: .95rem;
  color: rgba(237, 228, 211, .7);
  margin-top: .2rem;
}
.night .night-who {
  font-size: .92rem;
  color: var(--ash);
  margin-top: .2rem;
}
.night .night-heads {
  font-size: .82rem;
  color: var(--ash);
  margin-top: .25rem;
}
.night .night-note {
  font-size: .88rem;
  color: var(--ash);
  opacity: .82;
  margin-top: .35rem;
  text-wrap: pretty;
}

/* past nights recede */
.night.is-past { opacity: .38; }

/* tonight */
.night.is-tonight .n,
.night.is-tonight .night-meal { color: var(--lantern); }
.night.is-tonight .night-meal { font-weight: 700; }
.night.is-tonight .night-sides { color: var(--birch); }
.night .night-who.is-phrase { font-style: italic; }
.night.is-tonight .night-who { color: var(--birch); }
.night.is-tonight .night-heads { color: rgba(237, 228, 211, .8); }

/* ---- kids list ---------------------------------------------------- */
.kid { align-items: baseline; }

.kid .mark {
  font-size: .8rem;
  color: var(--lake);
}
.kid .kid-meal {
  font-size: 1.22rem;
  font-weight: 500;
  line-height: 1.25;
  text-wrap: balance;
}

/* ---- recipes ------------------------------------------------------
   A disclosure under the night, closed by default — the page still
   answers "what's for dinner" in one glance, and the recipe is one tap
   away for whoever is actually cooking. */
.recipe { margin-top: .6rem; }

.recipe > summary {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  cursor: pointer;
  list-style: none;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--lake);
  padding: .2rem 0;
}
.recipe > summary::-webkit-details-marker { display: none; }

.recipe > summary::before {
  content: "";
  width: .42rem; height: .42rem;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: translateY(-1px) rotate(-45deg);
  transition: transform .18s ease;
}
.recipe[open] > summary::before { transform: translateY(-2px) rotate(45deg); }

.recipe-body {
  margin-top: .75rem;
  padding: .95rem 1rem 1.05rem;
  border-left: 2px solid rgba(60,128,121,.5);
  background: rgba(15,46,40,.35);
  border-radius: 0 4px 4px 0;
}

.recipe-meta {
  font-size: .75rem;
  line-height: 1.5;
  color: var(--ash);
  margin-bottom: .85rem;
}
.recipe-meta a { color: var(--lake); }

.recipe h4 {
  margin: 0 0 .45rem;
  font-size: .66rem;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ash);
}
.recipe .ingredients + h4 { margin-top: 1.1rem; }

.recipe .ingredients li {
  font-size: .92rem;
  line-height: 1.5;
  padding: .16rem 0;
}
.recipe .ingredients .amt {
  color: var(--lantern);
  font-variant-numeric: tabular-nums;
}
.recipe .ingredients .prep { color: var(--ash); }

.recipe .steps { counter-reset: step; }
.recipe .steps li {
  position: relative;
  padding: .3rem 0 .3rem 1.6rem;
  font-size: .92rem;
  line-height: 1.55;
  text-wrap: pretty;
}
.recipe .steps li::before {
  counter-increment: step;
  content: counter(step);
  position: absolute;
  left: 0;
  top: .34rem;
  font-size: .74rem;
  font-weight: 700;
  color: var(--lake);
  font-variant-numeric: tabular-nums;
}

/* ---- shopping list ------------------------------------------------ */
.shop-group { margin-bottom: 1.6rem; }
.shop-group h3 {
  margin: 0 0 .5rem;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--lantern);
}
.shop-group.is-loose h3 { color: var(--ash); }

.shop-group li {
  display: grid;
  grid-template-columns: 5.5rem 1fr;
  gap: 0 .5rem;
  font-size: 1rem;
  line-height: 1.45;
  padding: .3rem 0;
  border-top: 1px solid rgba(237,228,211,.07);
}
.shop-group li:first-child { border-top: 0; }
.shop-group .amt {
  color: var(--lantern);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
/* The nights with no recipe yet don't have an amount column to line up
   against — they're a day and a list of names, so let them run inline. */
.shop-group.is-loose li { display: block; font-size: .95rem; }
.shop-group.is-loose .for {
  color: var(--lake);
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-right: .5rem;
}
/* How many you're buying for, on a night that has no recipe to say it. */
.shop-group.is-loose .loose-heads {
  display: block;
  font-size: .78rem;
  color: var(--ash);
  opacity: .85;
}

.copy {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  margin-bottom: 1.5rem;
  padding: .6rem 1rem;
  border: 1px solid rgba(242,169,59,.45);
  border-radius: 3px;
  background: none;
  font: inherit;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--lantern);
  cursor: pointer;
}
.copy:hover { background: rgba(242,169,59,.1); }
.copy-said {
  margin-left: .75rem;
  font-size: .7rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--lake);
}

.panel-note {
  margin-top: 1.5rem;
  font-size: .85rem;
  line-height: 1.55;
  color: var(--ash);
  opacity: .8;
  text-wrap: pretty;
}

/* ---- footer ------------------------------------------------------- */
.footer {
  padding: clamp(1.75rem, 7vw, 2.5rem) var(--edge) 3rem;
  text-align: center;
}
.footer p {
  max-width: var(--measure);
  margin: 0 auto;
  font-size: .78rem;
  line-height: 1.6;
  color: var(--ash);
  opacity: .75;
}

noscript .fallback {
  display: block;
  padding: 3rem var(--edge);
  text-align: center;
  color: var(--ash);
}

/* ---- motion ------------------------------------------------------- */
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}
@keyframes breathe {
  0%, 100% { opacity: .82; }
  50%      { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---- wider screens (afterthought, on purpose) --------------------- */
@media (min-width: 46rem) {
  .night, .kid { grid-template-columns: 3rem 1fr; padding: 1.25rem 0; }
  .night .night-meal, .kid .kid-meal { font-size: 1.35rem; }
}
</style>

          <span class="copy-said" id="copy-said" role="status" aria-live="polite"></span>
        </p>
        <div id="shop"></div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <p>Six dinners, Sunday through Friday. Plans change in the group text, not here &mdash; this page just says what's set.</p>
</footer>

<script>
(function () {
  "use strict";

  var DAYS   = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var DAY_MS = 86400000;
  var COUNT  = Math.min(NIGHTS.length, DAYS.length);

  /* ---- dates ------------------------------------------------------
     All arithmetic is on local midnights, so it lines up with whatever
     day the phone in the kitchen thinks it is. Math.round absorbs the
     one-hour wobble if a daylight-saving change lands mid-trip. */

  function midnight(y, m, d) { return new Date(y, m, d); }

  function dateOfNight(i) {
    return midnight(START[0], START[1] - 1, START[2] + i);
  }

  function shortDate(d) {
    return MONTHS[d.getMonth()] + " " + d.getDate();
  }

  var now     = new Date();
  var today   = midnight(now.getFullYear(), now.getMonth(), now.getDate());
  var firstNight = dateOfNight(0);
  var index   = Math.round((today - firstNight) / DAY_MS);

  /* ---- helpers ----------------------------------------------------- */

  function fill(id, text) {
    var node = document.getElementById(id);
    if (!text) { node.hidden = true; return; }
    node.textContent = text;
    node.hidden = false;
  }

  function make(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text) { node.textContent = text; }
    return node;
  }

  /* "Coleslaw · Green beans w/ bacon", with the dot in its own span so it can
     be coloured separately. The spaces around the dot are real characters, not
     just CSS padding, so the line still reads as separate things when it's
     spoken aloud or pasted into the group text. One part on its own is fine;
     none hides the line. */
  function dottedInto(node, parts) {
    node.textContent = "";
    if (!parts.length) { node.hidden = true; return node; }
    for (var i = 0; i < parts.length; i++) {
      if (i) { node.appendChild(make("span", "sep", " · ")); }
      node.appendChild(document.createTextNode(parts[i]));
    }
    node.hidden = false;
    return node;
  }

  function sidesInto(node, night) {
    return dottedInto(node, [night.side1, night.side2, night.side3].filter(Boolean));
  }

  /* A night with no cook yet reads as "Up for grabs" rather than going
     blank, so an unclaimed night looks unclaimed instead of looking like
     nothing. Anything in AS_IS_COOKS is a statement about the night, not a
     person, so it skips the "Cooked by" prefix and is styled as a phrase
     rather than as a name. */
  function setWho(node, baseClass, who, prefix) {
    var text = who || "Up for grabs";
    var asIs = AS_IS_COOKS.indexOf(text) !== -1;
    node.textContent = asIs ? text : prefix + text;
    node.className = asIs ? baseClass + " is-phrase" : baseClass;
    node.hidden = false;
    return node;
  }

  /* ---- amounts -----------------------------------------------------
     Recipe quantities are stored as plain numbers so they can be scaled
     and added together, and turned back into the fractions a cook
     expects only at the moment they're printed. */

  var FRACTIONS = [
    [.125, "⅛"], [.25, "¼"], [.333, "⅓"], [.375, "⅜"], [.5, "½"],
    [.625, "⅝"], [.667, "⅔"], [.75, "¾"], [.875, "⅞"]
  ];

  var PLURALS = {
    cup: "cups", clove: "cloves", can: "cans", leaf: "leaves",
    bunch: "bunches", pinch: "pinches", jar: "jars", loaf: "loaves",
    head: "heads", sprig: "sprigs", meatball: "meatballs", quart: "quarts"
  };

  function qtyText(n) {
    if (n === null || n === undefined) { return ""; }
    var whole = Math.floor(n + 1e-9);
    var rest  = n - whole;
    var mark  = "";

    for (var i = 0; i < FRACTIONS.length; i++) {
      if (Math.abs(rest - FRACTIONS[i][0]) < .021) { mark = FRACTIONS[i][1]; break; }
    }
    /* Nothing tidy to land on — say the number plainly rather than
       rounding a shopping amount to something that isn't true. */
    if (!mark && rest > .021) { return String(Math.round(n * 100) / 100); }
    if (!whole) { return mark || "0"; }
    return whole + mark;
  }

  function unitText(unit, n) {
    if (!unit) { return ""; }
    return (n > 1 && PLURALS[unit]) ? PLURALS[unit] : unit;
  }

  /* "1½ tbsp flat-leaf parsley" — amount and name kept apart so the
     amount can be coloured and the name can line up in a column.
     A unit with no number behind it is meaningless ("cup olive oil"),
     so a qty-less ingredient just gives its name. */
  function amountOf(ing) {
    if (typeof ing.qty !== "number") { return ""; }
    return [qtyText(ing.qty), unitText(ing.unit, ing.qty)]
             .filter(Boolean).join(" ");
  }

  function scaled(ing, by) {
    var out = {};
    for (var k in ing) { if (ing.hasOwnProperty(k)) { out[k] = ing[k]; } }
    if (typeof ing.qty === "number") { out.qty = ing.qty * by; }
    return out;
  }

  /* ---- who's at the table -------------------------------------------
     Heads are two different things at once: something to print on the
     night, and the number the recipes are scaled against. Kids are the
     reason those aren't the same — seven kids is seven place settings
     but nothing like seven dinners. */

  function kidAges(night) {
    return Array.isArray(night && night.kids) ? night.kids : null;
  }

  function kidCount(night) {
    var ages = kidAges(night);
    if (ages) { return ages.length; }
    return (night && typeof night.kids === "number") ? night.kids : 0;
  }

  function kidEats(age) {
    for (var i = 0; i < KID_APPETITE.length; i++) {
      if (age < KID_APPETITE[i].under) { return KID_APPETITE[i].eats; }
    }
    return 1;
  }

  /* Grown-up portions the night has to cover. null when the night doesn't
     say who's coming, which leaves the recipes at their published size
     rather than guessing. */
  function portionsOf(night) {
    if (!night || typeof night.adults !== "number") { return null; }
    var ages  = kidAges(night);
    var total = night.adults;

    if (ages) {
      ages.forEach(function (age) { total += kidEats(age); });
    } else if (typeof night.kids === "number") {
      total += night.kids * KID_EATS;
    }
    return total;
  }

  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  /* ["7 adults", "4 kids", "ages 13, 11, 7, 3½"] — the ages only when the
     night actually lists them. */
  function headsParts(night) {
    if (!night || typeof night.adults !== "number") { return []; }

    var parts = [plural(night.adults, "adult")];
    var kids  = kidCount(night);
    if (kids) { parts.push(plural(kids, "kid")); }

    var ages = kidAges(night);
    if (ages && ages.length) {
      parts.push((ages.length === 1 ? "age " : "ages ") +
                 ages.map(qtyText).join(", "));
    }
    return parts;
  }

  function headsInto(node, night) {
    return dottedInto(node, headsParts(night));
  }

  /* "9 adults & 7 kids" — the same count said in one breath, for places
     that already have a line of their own going. */
  function headsShort(night) {
    return headsParts(night).slice(0, 2).join(" & ");
  }

  /* ---- batch size ----------------------------------------------------
     A recipe is written for so many people; the night has so many people.
     Round the ratio to the nearest half, because half a recipe is a thing
     you can stand at a counter and cook and 1.79 of one is not. */

  function roundBatch(n) {
    var half = Math.round(n * 2) / 2;
    return half < .5 ? .5 : half;
  }

  function scaleFor(recipe, night) {
    if (typeof recipe.scale === "number") { return recipe.scale; }  /* pinned by hand */
    var mouths = portionsOf(night);
    if (mouths === null || !recipe.serves) { return 1; }
    return roundBatch(mouths / recipe.serves);
  }

  /* ---- the hero ----------------------------------------------------
     Three states: before the trip, during it, after Friday. */

  function renderHero() {
    document.getElementById("stamp").textContent =
      shortDate(dateOfNight(0)) + " – " + shortDate(dateOfNight(COUNT - 1));

    var heroSides = document.getElementById("sides");
    var heroHeads = document.getElementById("heads");

    // After Friday — sign-off.
    if (index >= COUNT) {
      fill("eyebrow", "That's the week");
      fill("meal", "Till next time");
      sidesInto(heroSides, {});
      fill("who", "");
      fill("note", "Six dinners, nobody went hungry. Text the group when you're home.");
      headsInto(heroHeads, null);
      fill("counter", "");
      return;
    }

    // Before the trip — countdown, plus a look at night one.
    if (index < 0) {
      var out = -index;
      fill("eyebrow", out === 1 ? "Tomorrow" : out + " days out");
      fill("meal", NIGHTS[0].meal);
      sidesInto(heroSides, NIGHTS[0]);
      setWho(document.getElementById("who"), "who", NIGHTS[0].who, "Cooked by ");
      fill("note", NIGHTS[0].note);
      headsInto(heroHeads, NIGHTS[0]);
      fill("counter", "First night · " + DAYS[0] + ", " + shortDate(dateOfNight(0)));
      return;
    }

    // During the trip — tonight is the whole point of the page.
    var tonight = NIGHTS[index];
    fill("eyebrow", "Tonight · " + DAYS[index]);
    fill("meal", tonight.meal);
    sidesInto(heroSides, tonight);
    setWho(document.getElementById("who"), "who", tonight.who, "Cooked by ");
    fill("note", tonight.note);
    headsInto(heroHeads, tonight);
    fill("counter", "Night " + (index + 1) + " of " + COUNT +
                    " · " + shortDate(dateOfNight(index)));
  }

  /* ---- recipes ------------------------------------------------------
     Closed by default. The page's job is still to answer "what's for
     dinner" without a tap; the recipe is there for whoever is cooking. */

  function recipeNode(key, night) {
    var recipe = RECIPES[key];
    if (!recipe) { return null; }

    var by   = scaleFor(recipe, night);
    var box  = make("details", "recipe");
    var head = make("summary", null, "Recipe · " + recipe.title);
    box.appendChild(head);

    var body = make("div", "recipe-body");

    /* Yield is scaled too, so the line says what you'll actually end up
       with rather than what the book says. */
    var meta  = make("p", "recipe-meta");
    var bits  = [];
    if (recipe.makes) {
      bits.push("Makes " + qtyText(recipe.makes.qty * by) + " " +
                unitText(recipe.makes.unit, recipe.makes.qty * by));
    }
    if (by !== 1) { bits.push(qtyText(by) + "× the original"); }

    /* Say who the batch was sized for, so the number above is checkable
       against the night rather than being taken on faith. */
    var forWhom = headsShort(night);
    if (forWhom) { bits.push("For " + forWhom); }

    if (recipe.time) { bits.push(recipe.time); }
    meta.appendChild(document.createTextNode(bits.join(" · ")));

    if (recipe.source) {
      meta.appendChild(make("br"));
      if (recipe.url) {
        var link = make("a", null, recipe.source);
        link.href = recipe.url;
        link.rel = "noopener noreferrer";
        link.target = "_blank";
        meta.appendChild(link);
      } else {
        meta.appendChild(document.createTextNode(recipe.source));
      }
    }
    body.appendChild(meta);

    body.appendChild(make("h4", null, "Ingredients"));
    var ings = make("ul", "ingredients");
    recipe.ingredients.forEach(function (ing) {
      var line = make("li");
      var amt  = amountOf(scaled(ing, by));
      if (amt) { line.appendChild(make("span", "amt", amt + " ")); }
      line.appendChild(document.createTextNode(ing.item));
      if (ing.prep) { line.appendChild(make("span", "prep", ", " + ing.prep)); }
      ings.appendChild(line);
    });
    body.appendChild(ings);

    body.appendChild(make("h4", null, "Method"));
    var steps = make("ol", "steps");
    recipe.steps.forEach(function (step) {
      steps.appendChild(make("li", null, step));
    });
    body.appendChild(steps);

    box.appendChild(body);
    return box;
  }

  /* ---- the week list ----------------------------------------------- */

  function renderWeek() {
    var list = document.getElementById("nights");

    for (var i = 0; i < COUNT; i++) {
      var night = NIGHTS[i];
      var item  = make("li", "night");

      if (i < index)       { item.className += " is-past"; }
      else if (i === index) {
        item.className += " is-tonight";
        item.setAttribute("aria-current", "date");
      }

      var number = make("span", "n", String(i + 1).padStart(2, "0"));
      number.setAttribute("aria-hidden", "true");
      item.appendChild(number);

      var body = make("div", "night-body");

      var day = make("p", "day", DAYS[i] + " · " + shortDate(dateOfNight(i)));
      if (i < index)        { day.appendChild(make("span", "sr-only", " — done")); }
      else if (i === index) { day.appendChild(make("span", "sr-only", " — tonight")); }
      body.appendChild(day);

      body.appendChild(make("p", "night-meal", night.meal));

      var sides = sidesInto(make("p", "night-sides"), night);
      if (!sides.hidden) { body.appendChild(sides); }

      body.appendChild(setWho(make("p"), "night-who", night.who, ""));

      var heads = headsInto(make("p", "night-heads"), night);
      if (!heads.hidden) { body.appendChild(heads); }

      if (night.note) { body.appendChild(make("p", "night-note", night.note)); }

      (night.cook || []).forEach(function (key) {
        var recipe = recipeNode(key, night);
        if (recipe) { body.appendChild(recipe); }
      });

      item.appendChild(body);
      list.appendChild(item);
    }
  }

  /* ---- the kids list ------------------------------------------------ */

  function renderKids() {
    var list = document.getElementById("kids");

    for (var i = 0; i < KIDS.length; i++) {
      var item = make("li", "kid");

      var mark = make("span", "mark", "●");
      mark.setAttribute("aria-hidden", "true");
      item.appendChild(mark);

      item.appendChild(make("p", "kid-meal", KIDS[i]));
      list.appendChild(item);
    }
  }

  /* ---- the shopping list --------------------------------------------
     Everything the week's recipes call for, scaled, added up and sorted
     into aisles — plus an honest tail of what still has no recipe, so
     nothing quietly falls off the list. */

  var AISLES = ["Produce", "Meat", "Dairy", "Bakery", "Pantry"];

  /* The aisles in order, then any group the config named that isn't one
     of them. A typo'd group has to still show up somewhere — dropping
     an ingredient because it says "produce" instead of "Produce" would
     be a silent hole in a shopping list, which is the one thing this
     tab must never have. It shows up under its own odd heading, which
     is exactly how you spot it. */
  function aisleOrder(rows) {
    var order = AISLES.slice();
    rows.forEach(function (row) {
      if (order.indexOf(row.group) === -1) { order.push(row.group); }
    });
    return order;
  }

  function shoppingRows() {
    var rows = [];
    var seen = {};

    /* Two lines merge only when the item and the unit match exactly.
       Adding cups to tablespoons behind the owner's back would be a
       nice trick right up until it was wrong in a store. */
    function push(ing, group) {
      var key = (ing.item + "|" + (ing.unit || "")).toLowerCase();

      if (seen.hasOwnProperty(key)) {
        var at = rows[seen[key]];
        if (typeof at.qty === "number" && typeof ing.qty === "number") {
          at.qty += ing.qty;
        } else {
          at.qty = null;   /* one of them is a "to taste" — just name it */
        }
        return;
      }

      seen[key] = rows.length;
      rows.push({
        qty:   typeof ing.qty === "number" ? ing.qty : null,
        unit:  ing.unit || "",
        item:  ing.item,
        group: group || "Pantry"
      });
    }

    NIGHTS.forEach(function (night) {
      (night.cook || []).forEach(function (key) {
        var recipe = RECIPES[key];
        if (!recipe) { return; }
        var by = scaleFor(recipe, night);

        recipe.ingredients.forEach(function (ing) {
          if (ing.shop === false) { return; }
          if (ing.shop) { push(ing.shop, ing.shop.group || ing.group); }
          else          { push(scaled(ing, by), ing.group); }
        });
      });
    });

    EXTRAS.forEach(function (extra) { push(extra, extra.group); });

    return rows;
  }

  /* Nights and sides with no recipe behind them. Shown rather than
     dropped — the gaps are the point of looking at this tab early. The
     head count rides along: with no recipe to size it, how many you're
     buying for is the only quantity this line can give you. */
  function looseEnds() {
    var out = [];

    for (var i = 0; i < COUNT; i++) {
      var night = NIGHTS[i];
      var bits  = [];
      if (!(night.cook || []).length) { bits.push(night.meal); }
      if (night.side1) { bits.push(night.side1); }
      if (night.side2) { bits.push(night.side2); }
      if (night.side3) { bits.push(night.side3); }
      if (bits.length) {
        out.push({ for: DAYS[i], what: bits.join(" · "), heads: headsShort(night) });
      }
    }

    if (KIDS.length) { out.push({ for: "Kids", what: KIDS.join(" · "), heads: "" }); }
    return out;
  }

  function renderShop() {
    var host = document.getElementById("shop");
    var rows = shoppingRows();

    aisleOrder(rows).forEach(function (aisle) {
      var mine = rows.filter(function (row) { return row.group === aisle; });
      if (!mine.length) { return; }

      var group = make("section", "shop-group");
      group.appendChild(make("h3", null, aisle));

      var list = make("ul");
      mine.forEach(function (row) {
        /* The trailing space is a real character, not just the grid gap,
           so the line still reads as an amount and a thing when it's
           spoken aloud or dragged out of the page. */
        var amt  = amountOf(row);
        var line = make("li");
        line.appendChild(make("span", "amt", amt ? amt + " " : ""));
        line.appendChild(make("span", null, row.item));
        list.appendChild(line);
      });

      group.appendChild(list);
      host.appendChild(group);
    });

    var loose = looseEnds();
    if (loose.length) {
      var tail = make("section", "shop-group is-loose");
      tail.appendChild(make("h3", null, "Still to work out"));

      var tailList = make("ul");
      loose.forEach(function (row) {
        var line = make("li");
        line.appendChild(make("span", "for", row.for + " "));
        line.appendChild(document.createTextNode(row.what));
        if (row.heads) { line.appendChild(make("span", "loose-heads", "For " + row.heads)); }
        tailList.appendChild(line);
      });

      tail.appendChild(tailList);
      host.appendChild(tail);
    }
  }

  /* ---- copying it out ------------------------------------------------
     Plain text, because it's going into a group message or the Notes
     app, not into anything that understands markup. */

  function shopText() {
    var rows  = shoppingRows();
    var lines = ["Yooper Meals — shopping list",
                 shortDate(dateOfNight(0)) + " – " + shortDate(dateOfNight(COUNT - 1)),
                 ""];

    aisleOrder(rows).forEach(function (aisle) {
      var mine = rows.filter(function (row) { return row.group === aisle; });
      if (!mine.length) { return; }

      lines.push(aisle.toUpperCase());
      mine.forEach(function (row) {
        var amt = amountOf(row);
        lines.push("- " + (amt ? amt + " " : "") + row.item);
      });
      lines.push("");
    });

    var loose = looseEnds();
    if (loose.length) {
      lines.push("STILL TO WORK OUT");
      loose.forEach(function (row) {
        lines.push("- " + row.for + (row.heads ? " (" + row.heads + ")" : "") +
                   ": " + row.what);
      });
      lines.push("");
    }

    return lines.join("\n").trim() + "\n";
  }

  function initCopy() {
    var button = document.getElementById("copy");
    var said   = document.getElementById("copy-said");

    function say(text) {
      said.textContent = text;
      setTimeout(function () { said.textContent = ""; }, 2500);
    }

    /* Older phone browsers don't have the async clipboard API, and it's
       refused outright on plain http — fall back to selecting a scratch
       textarea, which works everywhere this page will realistically be
       opened. */
    function theOldWay(text) {
      var pad = document.createElement("textarea");
      pad.value = text;
      pad.setAttribute("readonly", "");
      pad.style.position = "fixed";
      pad.style.top = "-1000px";
      document.body.appendChild(pad);
      pad.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(pad);
      return ok;
    }

    button.addEventListener("click", function () {
      var text = shopText();

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { say("Copied"); },
          function () { say(theOldWay(text) ? "Copied" : "Couldn't copy"); }
        );
        return;
      }

      say(theOldWay(text) ? "Copied" : "Couldn't copy");
    });
  }

  /* ---- tabs ---------------------------------------------------------
     Roving tabindex: only the selected tab is in the tab order, arrows
     move between them. */

  function initTabs() {
    var tabs = [].slice.call(document.querySelectorAll('[role="tab"]'));

    function select(tab, focusIt) {
      tabs.forEach(function (t) {
        var on = t === tab;
        t.setAttribute("aria-selected", on ? "true" : "false");
        t.tabIndex = on ? 0 : -1;
        document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
      });
      if (focusIt) { tab.focus(); }
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener("click", function () { select(tab, false); });

      tab.addEventListener("keydown", function (e) {
        var to = null;
        if (e.key === "ArrowRight") { to = tabs[(i + 1) % tabs.length]; }
        else if (e.key === "ArrowLeft") { to = tabs[(i - 1 + tabs.length) % tabs.length]; }
        else if (e.key === "Home") { to = tabs[0]; }
        else if (e.key === "End") { to = tabs[tabs.length - 1]; }
        if (to) { e.preventDefault(); select(to, true); }
      });
    });
  }

  renderHero();
  renderWeek();
  renderKids();
  renderShop();
  initCopy();
  initTabs();
})();
</script>

</body>
</html>
